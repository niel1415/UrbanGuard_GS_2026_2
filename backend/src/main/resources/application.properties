# Para demonstração e estudo local. Não publicar a API diretamente na internet.
server.address=0.0.0.0
server.port=${PORT:8080}
spring.application.name=UrbanGuard API
spring.datasource.url=jdbc:h2:file:./data/urbanguard;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
urban.demo.enabled=true
server.error.include-message=never
